<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кухня</title>
    
    <style>
    /* ОСНОВНОЙ СТИЛЬ */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
        font-weight: 600;
    }
    
    body {
        padding: 20px 40px;
        display: flex;
        flex-direction: column;
    
        background: url('Background.jpg') no-repeat center center fixed;
        background-size: cover;
        
    }
    
    /* КОНТЕЙНЕР МЕНЮ */
    .menu-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        overflow: hidden;
    }
    
    /* ЗАГОЛОВОК КАТЕГОРИИ - СЛЕВА */
    .category-header {
        text-align: left;
        margin: 25px 0 10px 0;
        padding: 10px 0;
        flex-shrink: 0;
    }
    
    .category-header h2 {
        font-size: 3.0em;
        margin: 0;
        font-weight: 700;
        display: block;
        padding: 5px 0;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    
    /* СТРОКА БЛЮДА */
    .dish-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 6px 0;
        padding: 4px 0;
        min-height: 1.8em;
        flex-shrink: 0;
    }
    
    /* ЯЧЕЙКИ */
    .dish-cell {
        padding: 0 8px;
        font-size: 2.2em;
        line-height: 1.2;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    
    /* НАЗВАНИЕ БЛЮДА */
    .dish-cell:first-child {
        text-align: left;
        font-weight: 600;
        flex: 3;
        padding-left: 0;
    }
    
    /* ЦЕНА */
    .dish-cell:last-child {
        text-align: right;
        font-weight: 700;
        min-width: 100px;
        flex: 0 0 auto;
        padding-right: 0;
    }
    
    /* ОСТАЛЬНЫЕ СТОЛБЦЫ */
    .dish-cell:not(:first-child):not(:last-child) {
        text-align: center;
        flex: 1;
        font-weight: 600;
    }
    
    /* СТИЛЬ ДЛЯ ТЕКСТА С ОБВОДКОЙ */
    .text-with-outline {
        display: inline-block;
    }
    
    /* КЛАСС ДЛЯ ПРИМЕНЕНИЯ ОБВОДКИ */
    .text-stroke {
        text-shadow: 
            1px 1px 2px var(--stroke, #000000),
            -1px -1px 2px var(--stroke, #000000),
            1px -1px 2px var(--stroke, #000000),
            -1px 1px 2px var(--stroke, #000000),
            0 0 4px var(--stroke, #000000) !important;
    }
    
    /* НЕДОСТУПНЫЕ ПОЗИЦИИ - 50% ПРОЗРАЧНОСТИ */
    .dish-row.unavailable {
        opacity: 0.5 !important;
        position: relative;
    }
    
    .dish-row.unavailable .dish-cell {
        color: #888888 !important;
        text-decoration: line-through !important;
        font-style: italic;
    }
    
    .dish-row.unavailable::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, 
            transparent 5%, 
            rgba(255, 0, 0, 0.4) 50%, 
            transparent 95%);
        transform: translateY(-50%);
        pointer-events: none;
        opacity: 0.7;
    }
    
    /* Стиль для заголовков с обводкой */
    .category-header h2.text-with-outline {
        text-shadow: 
            2px 2px 3px var(--stroke, #000000),
            -2px -2px 3px var(--stroke, #000000),
            2px -2px 3px var(--stroke, #000000),
            -2px 2px 3px var(--stroke, #000000),
            0 0 6px var(--stroke, #000000) !important;
    }
    </style>
    
</head>
<body>
    <div class="menu-container">

        <div class="category-header">
            <h2 class="text-with-outline text-stroke" style="color: #FFFFFF; --stroke: #000000;">Горячее</h2>
        </div>

        <div class="dish-row unavailable">

            <div class="dish-cell text-with-outline text-stroke truncate" style="color: #FFFFFF; --stroke: #000000;">Кесадилья с курицей</div>

            <div class="dish-cell text-with-outline text-stroke right-align" style="color: #FFFFFF; --stroke: #000000;">690₽</div>

        </div>

        <div class="dish-row">

            <div class="dish-cell text-with-outline text-stroke truncate" style="color: #FFFFFF; --stroke: #000000;">Фиш энд Чипс</div>

            <div class="dish-cell text-with-outline text-stroke right-align" style="color: #FFFFFF; --stroke: #000000;">590₽</div>

        </div>

        <div class="dish-row">

            <div class="dish-cell text-with-outline text-stroke truncate" style="color: #FFFFFF; --stroke: #000000;">Креветки с салатом коул слоу</div>

            <div class="dish-cell text-with-outline text-stroke right-align" style="color: #FFFFFF; --stroke: #000000;">590₽</div>

        </div>

        <div class="dish-row">

            <div class="dish-cell text-with-outline text-stroke truncate" style="color: #FFFFFF; --stroke: #000000;">Начос с xалапеньо</div>

            <div class="dish-cell text-with-outline text-stroke right-align" style="color: #FFFFFF; --stroke: #000000;">290₽</div>

        </div>

        <div class="dish-row">

            <div class="dish-cell text-with-outline text-stroke truncate" style="color: #FFFFFF; --stroke: #000000;">Луковые кольца</div>

            <div class="dish-cell text-with-outline text-stroke right-align" style="color: #FFFFFF; --stroke: #000000;">350₽</div>

        </div>

        <div class="dish-row unavailable">

            <div class="dish-cell text-with-outline text-stroke truncate" style="color: #FFFFFF; --stroke: #000000;">Гренки с чесноком и пармезаном</div>

            <div class="dish-cell text-with-outline text-stroke right-align" style="color: #FFFFFF; --stroke: #000000;">350₽</div>

        </div>

        <div class="dish-row">

            <div class="dish-cell text-with-outline text-stroke truncate" style="color: #FFFFFF; --stroke: #000000;">Сырные палочки с ягодным соусом</div>

            <div class="dish-cell text-with-outline text-stroke right-align" style="color: #FFFFFF; --stroke: #000000;">450₽</div>

        </div>

        <div class="dish-row">

            <div class="dish-cell text-with-outline text-stroke truncate" style="color: #FFFFFF; --stroke: #000000;">Чикен фингерс сладкий чили</div>

            <div class="dish-cell text-with-outline text-stroke right-align" style="color: #FFFFFF; --stroke: #000000;">450₽</div>

        </div>

        <div class="dish-row">

            <div class="dish-cell text-with-outline text-stroke truncate" style="color: #FFFFFF; --stroke: #FFFFFF;">Чикен фингерс барбекю</div>

            <div class="dish-cell text-with-outline text-stroke right-align" style="color: #FFFFFF; --stroke: #FFFFFF;">450₽</div>

        </div>

    </div>
    
    <script>
    // Запрет скролла
    document.addEventListener('wheel', function(e) {
        if (e.ctrlKey) return;
        e.preventDefault();
    }, { passive: false });
    
    // Скрываем курсор
    setTimeout(() => {
        document.body.style.cursor = 'none';
    }, 3000);
    
    // Отладка
    window.addEventListener('load', function() {
        console.log('=== ДЕБАГ ИНФОРМАЦИЯ ===');
        const unavailable = document.querySelectorAll('.dish-row.unavailable');
        console.log(`Недоступных позиций: ${unavailable.length}`);
        
        if (unavailable.length > 0) {
            unavailable.forEach((el, i) => {
                console.log(`❌ Недоступно ${i+1}: ${el.textContent.trim().substring(0, 50)}`);
            });
        } else {
            console.log('✅ Все позиции доступны');
        }
    });
    </script>
    
</body>
</html>
